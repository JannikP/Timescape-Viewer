_version: 1
title: Timescape Viewer
backstage:
    open_file: Open File
timescape:
    no_origin:
        caption: No source
        message: No file or realtime source open.
    no_scope:
        caption: No scopes
        message: There are no scopes to view. Add one of the available visualizers.
        add_line_chart: Add line chart
        add_spectrogram: Add spectrogram
        add_trail_chart: Add trail chart
    add_line_chart_hint: Add a line chart
    add_spectrogram_hint: Add a spectrogram
    add_trail_chart_hint: Add a trail chart
    minimize_scope_hint: Minimize this scope to a single line of text
    maximize_scope_hint: Maximize this scope to fill the entire window
    remove_scope_hint: Remove this scope
line_chart:
    visibility_hint: Toggle the visibility of this signal.
    delete_hint: Delete this signal.
    add_signal:
        placeholder: Enter signal name here...
        hint: Type a signal name here and press [Enter] to add a new signal to this line chart.
unit:
    second:
        name: Second
        description: "The second (symbol: s) is the unit of time in the International System of Units (SI)."
    metre:
        name: Metre
        description: "The metre (or meter in US spelling; symbol: m) is the base unit of length in the International System of Units (SI)."
    kilogram:
        name: Kilogram
        description: "The kilogram (also spelled kilogramme) is the base unit of mass in the International System of Units (SI), equal to one thousand grams."
    ampere:
        name: Ampere
        description: "The ampere (symbol: A) is the unit of electric current in the International System of Units (SI)."
    kelvin:
        name: Kelvin
        description: "The kelvin (symbol: K) is the base unit for temperature in the International System of Units (SI). The Kelvin scale is an absolute temperature scale that starts at the lowest possible temperature (absolute zero), taken to be 0 K."
    mole:
        name: Mole
        description: "The mole (symbol mol) is a unit of measurement, the base unit in the International System of Units (SI) for amount of substance."
    candela:
        name: Candela
        description: "The Candela (symbol: cd) is the SI unit of luminous intensity. It measures the luminous power per unit solid angle emitted in a particular direction."
